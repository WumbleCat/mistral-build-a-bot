[project]
name = "mistral-build-a-bot"
version = "0.1.0"
description = "Robot photo -> evidence-grounded, human-verified bill of materials (Mistral vision API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "notebook>=7.6.5",
    "pillow>=10.4",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.9",
    "requests>=2.34.2",
    "uvicorn>=0.30",
]

[project.scripts]
robot-bom = "robot_bom.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_bom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
