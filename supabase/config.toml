project_id = "buildfromvision"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true

[auth.email]
enable_signup = true
# Off for local development so sign-in is one step during a demo.
enable_confirmations = false

# Lets a visitor try the product with no email at all.
[auth.external.anonymous_users]
enabled = true

[functions.analyze-device]
verify_jwt = true

[functions.generate-video]
verify_jwt = true
